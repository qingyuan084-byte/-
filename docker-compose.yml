# ========================================================
# CinéMatic — Docker Compose 一键部署
# ========================================================
# 前置条件:
#   1. cp .env.docker.example .env.docker
#   2. 编辑 .env.docker，填入 ZHIPU_API_KEY
#
# 启动顺序:
#   docker compose up -d postgres redis          # 1) 基础设施
#   docker compose build backend frontend        # 2) 构建镜像
#   docker compose run --rm backend \
#     python scripts/import_movies_to_db.py      # 3) 导入数据
#   docker compose up -d                         # 4) 全部启动
#
# 访问:
#   前端  http://localhost:3000
#   后端  http://localhost:8002/docs
#   健康  http://localhost:8002/health
# ========================================================

services:

  # ── PostgreSQL 数据库 ────────────────────────────────
  postgres:
    image: postgres:16
    container_name: cinematic-postgres
    environment:
      POSTGRES_DB: movie_db
      POSTGRES_USER: movieuser
      POSTGRES_PASSWORD: moviepass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movieuser -d movie_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Redis 缓存 ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cinematic-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI 后端 ─────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cinematic-backend
    env_file:
      - .env.docker
    environment:
      APP_ENV: docker
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Vue 前端 (Nginx) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cinematic-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

# ── 持久化卷 ──────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
