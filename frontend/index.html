<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>随便乱推电影</title>
    <!-- 反-FOUC：在 Vue 挂载前同步设置 data-theme，防止页面闪烁 -->
    <script>
      (function () {
        var t = localStorage.getItem("cinematic-theme");
        var d = "dark";
        if (t === "light") {
          d = "light";
        } else if (!t || t === "system") {
          d = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", d);
      })();
    </script>
    <link rel="dns-prefetch" href="https://img1.doubanio.com" />
    <link rel="dns-prefetch" href="https://img2.doubanio.com" />
    <link rel="dns-prefetch" href="https://img3.doubanio.com" />
    <link rel="dns-prefetch" href="https://img9.doubanio.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
